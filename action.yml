name: "AegiLabs security audit"
description: >-
  Run the AegiLabs audit agent over this repository in CI. Findings land as
  inline PR annotations and a job summary; the branded PDF report is uploaded
  as an artifact. The repo is never cloned to us — it is audited in your own
  runner — but the code the agent reads is sent to the model as context.
author: AegiLabs
branding:
  icon: shield
  color: blue

inputs:
  key:
    description: >-
      Your Aegi key (aegi_live_...). Store it as a repository secret. Not needed
      when dry-run is true.
    required: false
    default: ""
  dry-run:
    description: >-
      Skip the agent entirely and fabricate findings instead. Costs nothing and
      calls no model, but exercises the whole reporting path — annotations, job
      summary, artifact, PR comment, fail-on gate. Use it to verify wiring.
    required: false
    default: "false"
  target:
    description: >-
      What to audit: a path in the repo (default '.') for a static audit, or a
      URL for a live assessment. A URL also requires confirm-authorized: true.
    required: false
    default: "."
  lang:
    description: "Report language: en or sv."
    required: false
    default: "en"
  max-turns:
    description: >-
      Agent turn cap. Higher digs deeper but costs more tokens against your
      quota; raise it for large repos.
    required: false
    default: "30"
  fail-on:
    description: >-
      Fail the job when a finding of this severity or worse is present:
      critical | high | medium | low | info | none.
    required: false
    default: "critical"
  scanners:
    description: >-
      Comma-separated scanners to install and run for grounding. Empty string
      installs none (findings become LLM-only).
      Available: gitleaks, osv-scanner, semgrep, trufflehog.
    required: false
    default: "gitleaks,osv-scanner,semgrep"
  pdf:
    description: "Install typst so the report is a branded PDF (else HTML)."
    required: false
    default: "true"
  upload-artifact:
    description: "Upload the report, findings JSON and transcript as an artifact."
    required: false
    default: "true"
  artifact-name:
    description: "Name of the uploaded artifact."
    required: false
    default: "aegi-report"
  comment-pr:
    description: >-
      Post (and keep updating) a summary comment on the pull request. Needs
      `permissions: pull-requests: write` on the job.
    required: false
    default: "false"
  eu:
    description: >-
      EU data-residency mode. Pins the model to an EU-hosted provider, proves
      the proxy answers from inside the EU before any code is sent, and runs the
      scanners with the flags that keep code, secrets and your dependency graph
      off US services. Fails the run rather than quietly downgrading.
      Note that a GitHub-hosted runner is itself largely US compute — see
      "EU data residency" in the README before relying on this.
    required: false
    default: "false"
  fix:
    description: >-
      After reporting, run a second agent pass that fixes the findings and open
      a pull request with the patch. Costs a second run against your quota.
      Needs `permissions: contents: write` and `pull-requests: write`.
    required: false
    default: "false"
  fix-severity:
    description: >-
      Only fix findings at this severity or worse: critical | high | medium |
      low | info. Keep it high or worse unless you want a large diff.
    required: false
    default: "high"
  fix-branch:
    description: >-
      Branch to push the fixes to. Empty derives one from the run
      (aegi/fix-<run_id>), which never collides and never reuses a branch a
      human has since edited.
    required: false
    default: ""
  fix-base:
    description: >-
      Branch the fix PR targets. Empty means the branch that was audited — on a
      pull_request run that is the PR's own head branch, so the fixes stack onto
      the PR under review rather than jumping ahead of it to the default branch.
    required: false
    default: ""
  fix-draft:
    description: >-
      Open the fix PR as a draft. These are LLM-written patches; a draft makes
      "read this before you trust it" the default posture.
    required: false
    default: "true"
  fix-max-turns:
    description: "Turn cap for the fix pass. Empty reuses max-turns."
    required: false
    default: ""
  confirm-authorized:
    description: >-
      Confirm you are authorized to actively security-test the target. Required
      only when `target` is a URL; repo audits never need it.
    required: false
    default: "false"
  aegi-version:
    description: >-
      Pin the `aegilabs` npm release, e.g. '0.2.0'. Empty installs the latest.
      Pin it if you want a reproducible gate.
    required: false
    default: ""
  node-version:
    description: "Node used to run aegi (needs 20+)."
    required: false
    default: "24"
  python-version:
    description: >-
      Python for this action's own helper scripts (annotations, dry-run
      fixture). The audit itself no longer needs Python.
    required: false
    default: "3.11"
  proxy:
    description: "Override the metering proxy URL. Internal/staging use only."
    required: false
    default: ""

outputs:
  critical:
    description: "Number of critical findings."
    value: ${{ steps.report.outputs.critical }}
  high:
    description: "Number of high findings."
    value: ${{ steps.report.outputs.high }}
  medium:
    description: "Number of medium findings."
    value: ${{ steps.report.outputs.medium }}
  low:
    description: "Number of low findings."
    value: ${{ steps.report.outputs.low }}
  info:
    description: "Number of informational findings."
    value: ${{ steps.report.outputs.info }}
  total:
    description: "Total number of findings."
    value: ${{ steps.report.outputs.total }}
  worst:
    description: "Highest severity present, or 'none'."
    value: ${{ steps.report.outputs.worst }}
  fix-pr:
    description: "URL of the pull request holding the fixes, or empty if none was opened."
    value: ${{ steps.fixpr.outputs.url }}
  fixed:
    description: "Number of findings the fix pass changed code for."
    value: ${{ steps.fixpr.outputs.fixed }}
  report-dir:
    description: "Directory holding the report, findings JSON and transcript."
    value: ${{ steps.paths.outputs.dir }}

runs:
  using: composite
  steps:
    - name: Resolve output paths
      id: paths
      shell: bash
      run: |
        dir="${RUNNER_TEMP}/aegi-report"
        mkdir -p "$dir"
        # Report goes to a temp dir, never the workspace: the audit is read-only
        # and must not leave the repo dirty for later steps.
        echo "dir=$dir" >> "$GITHUB_OUTPUT"
        echo "pdf=$dir/aegi-report.pdf" >> "$GITHUB_OUTPUT"
        echo "data=$dir/aegi-report.data.json" >> "$GITHUB_OUTPUT"

    # Python is only for this action's own helper scripts (annotate.py,
    # dry_run.py). The audit itself no longer needs it — aegi is a Node package
    # and the agent runtime ships inside it.
    - uses: actions/setup-python@v7
      with:
        python-version: ${{ inputs.python-version }}

    - uses: actions/setup-node@v7
      if: ${{ inputs.dry-run != 'true' }}
      with:
        node-version: ${{ inputs.node-version }}

    - name: Install the agent
      if: ${{ inputs.dry-run != 'true' }}
      shell: bash
      run: |
        set -euo pipefail
        # One install, no separate agent CLI: @anthropic-ai/claude-agent-sdk
        # bundles the runtime as a platform-specific optional dependency.
        spec="aegilabs"
        # `[ -n "" ] && ...` exits 1, which under `set -e` would kill the step.
        if [ -n "${{ inputs.aegi-version }}" ]; then
          spec="aegilabs@${{ inputs.aegi-version }}"
        fi
        npm install -g "$spec"
        aegi --help > /dev/null && echo "aegi installed: $(npm list -g aegilabs --depth=0 | tail -1)"

    - name: Install scanners and typst
      if: ${{ inputs.dry-run != 'true' }}
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
      run: bash "${{ github.action_path }}/install_tools.sh" "${{ inputs.scanners }}" "${{ inputs.pdf }}"

    - name: Fabricate a result (dry run)
      if: ${{ inputs.dry-run == 'true' }}
      shell: bash
      run: |
        echo "::notice title=aegi dry run::No model was called and no quota spent. Findings below are synthetic."
        python "${{ github.action_path }}/dry_run.py" --target "${{ inputs.target }}" --out-dir "${{ steps.paths.outputs.dir }}"

    - name: Run the audit
      if: ${{ inputs.dry-run != 'true' }}
      shell: bash
      env:
        AEGI_KEY: ${{ inputs.key }}
        AEGI_PROXY_URL: ${{ inputs.proxy }}
      run: |
        set -uo pipefail
        if [ -z "${AEGI_KEY:-}" ]; then
          # Single-quoted: backticks inside a double-quoted string are command
          # substitution, which would run `key:`, blank the word, and print a
          # shell error into the customer's first-run failure message.
          echo '::error title=aegi::no key supplied. Pass the `key:` input (a repository secret), or set dry-run: true to test the wiring for free.'
          exit 1
        fi
        [ -z "${AEGI_PROXY_URL:-}" ] && unset AEGI_PROXY_URL
        args=(--max-turns "${{ inputs.max-turns }}" --lang "${{ inputs.lang }}"
              --out "${{ steps.paths.outputs.pdf }}")
        [ "${{ inputs.confirm-authorized }}" = "true" ] && args+=(--yes)
        if [ "${{ inputs.eu }}" = "true" ]; then
          args+=(--eu)
          # The runner is not ours and is not covered by the residency claim.
          # `aegi --eu` guarantees where the *model* traffic goes; it cannot
          # move the machine holding the checkout. Say so where someone will
          # actually read it, rather than only in the README.
          if [ "${{ runner.environment }}" = "github-hosted" ]; then
            echo "::warning title=aegi --eu::the model traffic stays in the EU, but this GitHub-hosted runner is largely US compute — your source sits on US infrastructure before it ever reaches us. Use a self-hosted EU runner for an end-to-end EU claim."
          fi
          # Under --eu, semgrep is skipped unless a local ruleset is supplied,
          # because `--config auto` fetches rules from semgrep.dev and uploads
          # scan metadata. A quietly missing scanner reads as "clean".
          if [ -z "${AEGI_SEMGREP_CONFIG:-}" ] && [[ "${{ inputs.scanners }}" == *semgrep* ]]; then
            echo "::warning title=aegi --eu::semgrep grounding is withheld — set the AEGI_SEMGREP_CONFIG env var to a local ruleset to re-enable it under --eu."
          fi
        fi
        # The agent's own exit status is not the gate — a truncated or partly
        # failed run can still have produced real findings. The gate is the
        # report step, which reads what was actually written.
        aegi "${{ inputs.target }}" "${args[@]}" || \
          echo "::warning::aegi exited non-zero; evaluating whatever findings it wrote"

    - name: Annotate findings and gate
      id: report
      shell: bash
      run: |
        # asset paths are relative to the TARGET; GitHub resolves annotation
        # paths against the repo root. Same thing only when target is '.'.
        root="${{ github.workspace }}"
        if [ -d "${{ github.workspace }}/${{ inputs.target }}" ]; then
          root="${{ github.workspace }}/${{ inputs.target }}"
        fi
        python "${{ github.action_path }}/annotate.py" \
          "${{ steps.paths.outputs.data }}" \
          --root "$root" --repo-root "${{ github.workspace }}" \
          --fail-on "${{ inputs.fail-on }}" \
          --comment-file "${{ steps.paths.outputs.dir }}/comment.md" \
          --run-url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

    # ---------------------------------------------------------------- fixes
    #
    # A second agent pass, deliberately: the audit agent is read-only by
    # construction and stays that way, so the fixer works only from findings the
    # audit already committed to. It edits the checkout; the git half below is
    # plain shell, so no agent ever runs a git write command.
    #
    # always(): the gate above may already have failed the job, and a failing
    # gate is exactly when the fix PR is worth having.
    - name: Fix the findings
      id: fix
      if: ${{ always() && inputs.fix == 'true' && inputs.dry-run != 'true' }}
      shell: bash
      env:
        AEGI_KEY: ${{ inputs.key }}
        AEGI_PROXY_URL: ${{ inputs.proxy }}
      run: |
        set -uo pipefail
        [ -z "${AEGI_PROXY_URL:-}" ] && unset AEGI_PROXY_URL
        root="${{ github.workspace }}"
        if [ -d "${{ github.workspace }}/${{ inputs.target }}" ]; then
          root="${{ github.workspace }}/${{ inputs.target }}"
        fi
        data="${{ steps.paths.outputs.data }}"
        if [ ! -f "$data" ]; then
          echo "::notice title=aegi fix::the audit wrote no findings file; nothing to fix."
          exit 0
        fi
        turns="${{ inputs.fix-max-turns }}"
        [ -z "$turns" ] && turns="${{ inputs.max-turns }}"
        # --out into the temp dir, not the workspace: the only thing that may
        # dirty the checkout is the fix itself, or the commit below would sweep
        # our own summary into the customer's PR.
        args=(--findings "$data" --severity "${{ inputs.fix-severity }}"
              --max-turns "$turns"
              --out "${{ steps.paths.outputs.dir }}/aegi-fix.md")
        # The fix pass re-reads and re-sends the same source the audit did, so
        # it carries the same residency promise or the promise is worthless.
        if [ "${{ inputs.eu }}" = "true" ]; then args+=(--eu); fi
        aegi fix "$root" "${args[@]}" ||
          echo "::warning::aegi fix exited non-zero; committing whatever it did change"

    - name: Open a pull request with the fixes
      id: fixpr
      if: ${{ always() && inputs.fix == 'true' && inputs.dry-run != 'true' }}
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        set -euo pipefail
        cd "${{ github.workspace }}"

        # Stage only inside the audited target. The fixer is told to stay there,
        # and `git add -A` over the whole workspace would happily commit anything
        # an earlier step happened to drop in the checkout.
        path="${{ inputs.target }}"
        [ -d "$path" ] || path="."
        git add -A -- "$path"
        if git diff --cached --quiet; then
          echo "::notice title=aegi fix::no file changed — nothing to open a PR for."
          echo "url=" >> "$GITHUB_OUTPUT"
          echo "fixed=0" >> "$GITHUB_OUTPUT"
          exit 0
        fi

        base="${{ inputs.fix-base }}"
        if [ -z "$base" ]; then
          # The branch that was actually audited. On a pull_request run that is
          # the PR's head branch, so fixes land on the PR under review instead of
          # racing ahead of it onto the default branch.
          base="${GITHUB_HEAD_REF:-${GITHUB_REF_NAME}}"
        fi
        # `[ ... ] && x=y` returns 1 when the test fails, and under `set -e` that
        # kills the step. Every conditional in this block is written as an `if`
        # for that reason — the same trap that once broke the install step.
        branch="${{ inputs.fix-branch }}"
        if [ -z "$branch" ]; then branch="aegi/fix-${{ github.run_id }}"; fi

        git config user.name "aegi[bot]"
        git config user.email "noreply@aegilabs.se"
        git checkout -b "$branch"
        # Separate -m flags, not one embedded newline: a multi-line string in a
        # YAML block scalar has to be indented, and an unindented continuation
        # silently ends the scalar and breaks the whole action file.
        git commit -q -m "fix: apply aegi security findings" \
          -m "Written by the AegiLabs audit agent from its own findings on this branch. Review before merging: these edits came from a model." \
          -m "Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
        git push -q origin "$branch"

        body="${{ steps.paths.outputs.dir }}/aegi-fix.md"
        [ -f "$body" ] || echo "## Automated security fixes -- see the run for details." > "$body"

        args=(--repo "${{ github.repository }}" --base "$base" --head "$branch"
              --title "Security fixes from aegi (run ${{ github.run_id }})"
              --body-file "$body")
        if [ "${{ inputs.fix-draft }}" = "true" ]; then args+=(--draft); fi
        url="$(gh pr create "${args[@]}")"
        echo "Opened $url"
        echo "url=$url" >> "$GITHUB_OUTPUT"
        echo "[Fix PR]($url)" >> "$GITHUB_STEP_SUMMARY"

        n=0
        j="${{ steps.paths.outputs.dir }}/aegi-fix.json"
        if [ -f "$j" ]; then
          n="$(python "${{ github.action_path }}/count_fixed.py" "$j")"
        fi
        echo "fixed=$n" >> "$GITHUB_OUTPUT"

    - name: Upload report
      # always(): the report is most valuable exactly when the gate failed.
      if: ${{ always() && inputs.upload-artifact == 'true' }}
      uses: actions/upload-artifact@v7
      with:
        name: ${{ inputs.artifact-name }}
        path: |
          ${{ steps.paths.outputs.dir }}/aegi-report.*
          ${{ steps.paths.outputs.dir }}/aegi-fix.*
        if-no-files-found: warn

    - name: Comment on the pull request
      if: ${{ always() && inputs.comment-pr == 'true' && github.event_name == 'pull_request' }}
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        body="${{ steps.paths.outputs.dir }}/comment.md"
        [ -f "$body" ] || exit 0
        # --edit-last keeps one rolling comment instead of one per push.
        gh pr comment "${{ github.event.pull_request.number }}" \
             --repo "${{ github.repository }}" --body-file "$body" --edit-last \
          || gh pr comment "${{ github.event.pull_request.number }}" \
             --repo "${{ github.repository }}" --body-file "$body"
