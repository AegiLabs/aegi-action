# Audit every pull request; block on high or worse; keep one rolling comment.
# The common case — copy this into .github/workflows/security.yml.
name: security

on:
  pull_request:

# One audit per PR: a new push cancels the previous run instead of spending
# quota twice on the same branch.
concurrency:
  group: aegi-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write        # for comment-pr
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0          # gitleaks also scans history

      - uses: AegiLabs/aegi-action@v1
        with:
          key: ${{ secrets.AEGI_KEY }}
          fail-on: high
          comment-pr: true
          aegi-version: "0.2.0"   # pin so the gate is reproducible
